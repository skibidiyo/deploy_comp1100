<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Peerly Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { background: #fff; border-radius: 16px; box-shadow: 0 4px 32px rgba(0,0,0,.1); padding: 2.5rem 3rem; text-align: center; max-width: 440px; width: 100%; }
    h1 { color: #7c3aed; font-size: 1.8rem; margin-bottom: .5rem; }
    p { color: #6b7280; font-size: .95rem; margin-bottom: 1.5rem; }
    a { color: #7c3aed; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Welcome to Peerly</h1>
    <p>Hello, <strong>{{ user.full_name }}</strong>! You're signed in as {{ user.email }}.</p>
    <p><a href="{% url 'logout' %}">Log out</a></p>
  </div>
</body>
</html>
